[package]
name = "greentic-llm"
# The dev base MUST stay at 1.2.0 while any consumer requires this crate with
# the plain lane range `>=1.2.0-dev, <1.3.0-0`. Cargo admits a pre-release only
# where a comparator names its own major.minor.patch, so that range can select
# `1.2.0-*` and nothing else: a `1.2.7-dev.N` build is unreachable to every such
# consumer, and published crates (greentic-dw-operala-invoker 1.2.0-dev.35761287147)
# already carry it. Measured 2026-09-23, after a base bump to 1.2.7-dev.0 made
# greentic-runner's workspace unresolvable.
#
# Raising the base is only a fix for a crate whose stray `-research` prerelease
# sits at the SAME M.m.p as the lane builds (greentic-mcp-client `1.2.0-research`
# does; this crate's `1.2.6-research` does not, so the plain range never picked
# it and there was nothing here to fix).
version = "1.2.0-dev.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/greenticai/greentic-llm"
homepage = "https://github.com/greenticai/greentic-llm"
documentation = "https://docs.rs/greentic-llm"
readme = "README.md"
description = "Provider-agnostic multi-LLM abstraction for the Greentic platform (rig-core backend, 24 providers)."
keywords = ["greentic", "llm", "ai", "rig"]
categories = ["api-bindings"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
clap = { version = "4.5", optional = true }
futures-util = "0.3"
rig-core = { version = "0.38", optional = true }
rig-bedrock = { version = "0.38", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["rig"]
bedrock = ["rig", "dep:rig-bedrock"]
clap = ["dep:clap"]
rig = ["dep:rig-core"]
test-mock = []
